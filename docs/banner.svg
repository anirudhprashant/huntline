<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Huntline: find the jobs worth your time. Apply like you meant it.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1116"/><stop offset="1" stop-color="#161B23"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1E2530" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)" opacity=".6"/>
  <!-- the line: noise on the left, one signal on the right -->
  <path d="M0 300 H180 L200 288 L215 312 L232 292 L250 306 L270 296 L290 300 H560 L600 230 L640 300 H1040" stroke="#3A4250" stroke-width="3" fill="none"/>
