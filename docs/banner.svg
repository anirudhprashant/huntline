  <circle cx="1070" cy="300" r="22" fill="none" stroke="#FF5A1F" stroke-width="4"/>
  <circle cx="1070" cy="300" r="6" fill="#FF5A1F"/>
  <path d="M1070 262 V276 M1070 324 V338 M1032 300 H1046 M1094 300 H1108" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#F4F1EA" letter-spacing="-3">huntline</text>
  <text x="84" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#A9B1BD">Find the jobs worth your time. Apply like you meant it.</text>
  <text x="84" y="358" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" fill="#6B7584">96,541 postings scanned  ·  1,109 worth a look  ·  0 sent without you</text>
